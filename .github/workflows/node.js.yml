name: NigerSécurité - Tests Firestore

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: Vérification TypeScript
        run: npm run lint

      - name: Exécuter les tests unitaires et statiques (89 tests)
        run: npx vitest run tests/api-pin.test.ts tests/firestore-config.test.ts tests/staff-accounts.test.ts tests/auth-flow.test.ts tests/agent-badge.test.ts tests/checkpoint-print-export.test.ts

      - name: Installer Firebase CLI
        run: npm install --global firebase-tools

      - name: Tester les règles Firestore (22 tests)
        run: npm run test:rules

      - name: Compilation de production
        run: npm run build
